<title id="title">Profil — Donovan Prévost</title><desc id="desc">Étudiant en BUT Informatique au Havre. Développement d’applications web, mobiles et logicielles. Intérêt pour le code structuré, l’expérience utilisateur et le travail d’équipe.</desc>
