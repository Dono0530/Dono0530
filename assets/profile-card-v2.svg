<text x="38" y="48" fill="#80e3ff" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ÉTUDIANT · UNIVERSITÉ DU HAVRE</text>
<text x="38" y="92" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Je conçois des applications web, mobiles et logicielles.</text>
<text x="38" y="124" fill="#c3d5ed" font-family="Segoe UI,Arial,sans-serif" font-size="17">J’accorde de l’importance au code clair, à l’expérience utilisateur et au travail en équipe.</text>
