<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="title desc">
<title id="title">Profil — Donovan Prévost</title><desc id="desc">Étudiant de 20 ans en BUT Informatique à l’Université du Havre. Curieux et rigoureux, intéressé par les architectures logicielles propres, le développement web en Java et PHP, les applications mobiles et co-créateur de MateZone.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08162d"/><stop offset="1" stop-color="#171a36"/></linearGradient><linearGradient id="edge"><stop stop-color="#57d9ff"/><stop offset="1" stop-color="#ff6fae"/></linearGradient></defs>
<rect x="2" y="2" width="1196" height="288" rx="22" fill="url(#bg)" stroke="#294367" stroke-width="2"/><rect x="2" y="2" width="7" height="288" rx="4" fill="url(#edge)"/>
<text x="40" y="43" fill="#80e3ff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PROFIL · BUT INFORMATIQUE · UNIVERSITÉ DU HAVRE</text>
<text x="40" y="87" fill="#f5f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Étudiant de 20 ans, curieux et rigoureux.</text>
<text x="40" y="129" fill="#c9d8ee" font-family="Segoe UI,Arial,sans-serif" font-size="22">Je m’intéresse à la conception d’architectures logicielles propres et au développement web</text>
<text x="40" y="162" fill="#c9d8ee" font-family="Segoe UI,Arial,sans-serif" font-size="22">en Java et PHP, ainsi qu’à la création d’applications mobiles. Je suis co-créateur</text>
<text x="40" y="195" fill="#c9d8ee" font-family="Segoe UI,Arial,sans-serif" font-size="22">du projet <tspan fill="#ff9bc7" font-weight="700">MateZone</tspan>.</text>
<g transform="translate(40 222)"><rect width="218" height="46" rx="14" fill="#57d9ff" fill-opacity=".09" stroke="#57d9ff" stroke-opacity=".5"/><text x="19" y="30" fill="#7de5ff" font-family="Consolas,monospace" font-size="19" font-weight="700">&lt;/&gt;</text><text x="61" y="30" fill="#e4f2ff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">CODE STRUCTURÉ</text></g>
