<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Donovan Prévost — Informatique</title>
  <desc id="desc">Bannière bleu nuit, cyan et rose avec motifs abstraits évoquant le développement logiciel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/><stop offset=".55" stop-color="#10264a"/><stop offset="1" stop-color="#281535"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57d9ff"/><stop offset=".52" stop-color="#829bff"/><stop offset="1" stop-color="#ff6fae"/>
      <animate attributeName="x1" values="0;-.4;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.4;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a8dfff" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1015" cy="80" r="135" fill="#e84d9c" opacity=".17" filter="url(#glow)"/>
  <circle cx="935" cy="295" r="150" fill="#36c8fa" opacity=".14" filter="url(#glow)"/>
  <path d="M0 300 C250 255 360 365 620 300 S990 250 1200 290" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="2"/>
  <path d="M0 307 C250 262 360 372 620 307 S990 257 1200 297" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="8">
    <animate attributeName="stroke-opacity" values=".12;.38;.12" dur="4s" repeatCount="indefinite"/>
  </path>
  <rect x="72" y="63" width="5" height="226" rx="3" fill="url(#accent)"/>
  <text x="108" y="143" fill="#f5f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1">DONOVAN PRÉVOST</text>
  <text x="111" y="194" fill="#c6d7f2" font-family="Segoe UI, Arial, sans-serif" font-size="24">Étudiant en BUT Informatique · Développement logiciel</text>
  <rect x="110" y="226" width="157" height="36" rx="18" fill="#57d9ff" fill-opacity=".12" stroke="#57d9ff" stroke-opacity=".65"/>
  <text x="188" y="250" fill="#83e5ff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">WEB &amp; LOGICIEL</text>
  <rect x="279" y="226" width="133" height="36" rx="18" fill="#ff6fae" fill-opacity=".12" stroke="#ff6fae" stroke-opacity=".65"/>
  <text x="345" y="250" fill="#ff9bc7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">PROJETS</text>
  <g transform="translate(825 94)">
    <ellipse cx="155" cy="83" rx="155" ry="69" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="2" transform="rotate(-18 155 83)"/>
    <ellipse cx="155" cy="83" rx="123" ry="48" fill="none" stroke="#9bc9ff" stroke-opacity=".2" stroke-width="1" transform="rotate(22 155 83)"/>
    <rect x="73" y="28" width="164" height="112" rx="12" fill="#0a1830" fill-opacity=".88" stroke="#68d8ff" stroke-opacity=".65"/>
    <path d="M73 51H237" stroke="#68d8ff" stroke-opacity=".35"/>
    <circle cx="89" cy="40" r="3" fill="#ff6fae"/><circle cx="101" cy="40" r="3" fill="#68d8ff"/><circle cx="113" cy="40" r="3" fill="#b5a6ff"/>
    <text x="93" y="81" fill="#68d8ff" font-family="Consolas, monospace" font-size="18">&lt;/&gt;</text>
    <rect x="130" y="68" width="74" height="5" rx="2" fill="#ff6fae" opacity=".9"/>
    <rect x="130" y="84" width="55" height="5" rx="2" fill="#68d8ff" opacity=".8"/>
    <rect x="93" y="105" width="111" height="5" rx="2" fill="#c5d4ed" opacity=".35"/>
    <circle cx="281" cy="56" r="5" fill="#ff6fae"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="33" cy="134" r="4" fill="#68d8ff"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
</svg>